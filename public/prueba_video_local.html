<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Prueba de vídeo local · Clases de Ritmo</title>
<style>body{font-family:system-ui,sans-serif;background:#f3f5fb;color:#18284b;margin:0;padding:24px}.wrap{max-width:850px;margin:auto}.card{background:white;border:1px solid #dce3f1;border-radius:18px;padding:22px}h1{margin-top:0}video{cursor:pointer;display:block;width:100%;aspect-ratio:16/9;object-fit:contain;background:#101522;border-radius:14px;margin:15px 0}label{font-weight:700;display:block;margin:12px 0}button{padding:12px 20px;border:0;background:#425fce;color:white;border-radius:12px;font-weight:700;cursor:pointer}button:disabled{opacity:.5}.progress{background:#e6eaf3;height:12px;border-radius:8px;overflow:hidden}.progress>div{height:100%;width:0;background:#425fce}p{line-height:1.5}.seekrow{display:flex;align-items:center;gap:12px;margin:12px 0}.seekrow input{flex:1;min-width:0;accent-color:#425fce;cursor:pointer}.seekrow input:disabled{opacity:.5}.timer{font-variant-numeric:tabular-nums;white-space:nowrap;color:#53627a;font-size:.9rem}</style>
</head><body><main class="wrap"><div class="card"><h1>Prueba de reproductor sin YouTube</h1><p>Selecciona un vídeo MP4 de tu ordenador. No se sube a Internet: esta pantalla sirve para comprobar los botones y el porcentaje. No guarda estadísticas.</p><label>Elegir vídeo de tu ordenador <input id="file" type="file" accept="video/mp4"></label><video id="video" playsinline preload="metadata" disablepictureinpicture controlslist="nodownload noplaybackrate"></video><div class="seekrow"><span class="timer" id="current">0:00</span><input id="seek" type="range" min="0" max="1000" value="0" step="1" disabled aria-label="Barra de tiempo para adelantar o retroceder"><span class="timer" id="total">0:00</span></div><button id="play" disabled>▶ Reproducir</button><p id="status">Selecciona un archivo MP4 para empezar.</p><div class="progress"><div id="bar"></div></div><p id="pct">0 % visto</p></div></main>
<script>
const file=document.getElementById('file'),video=document.getElementById('video'),play=document.getElementById('play'),status=document.getElementById('status'),pct=document.getElementById('pct'),bar=document.getElementById('bar'),seek=document.getElementById('seek'),current=document.getElementById('current'),total=document.getElementById('total');
let src='',last=0,parts=[],clock=null,dragging=false;function fmt(t){if(!Number.isFinite(t))return '0:00';t=Math.floor(t);return Math.floor(t/60)+':'+String(t%60).padStart(2,'0')}function timeUI(){if(!Number.isFinite(video.duration)||video.duration<=0)return;total.textContent=fmt(video.duration);if(!dragging){seek.value=String(Math.round(video.currentTime/video.duration*1000));current.textContent=fmt(video.currentTime)}}
function record(){timeUI();if(video.paused||video.seeking||!Number.isFinite(video.duration))return;const t=video.currentTime,d=t-last;if(d>=0&&d<2.5&&d>0)parts.push([last,t]);last=t;const merged=[];for(const r of parts.sort((a,b)=>a[0]-b[0])){const p=merged.at(-1);if(p&&r[0]<=p[1]+0.1)p[1]=Math.max(p[1],r[1]);else merged.push([...r])}parts=merged;const seen=parts.reduce((n,r)=>n+r[1]-r[0],0),percent=Math.min(100,seen/video.duration*100);pct.textContent=Math.round(percent)+' % visto · '+Math.round(seen)+' segundos de partes distintas';bar.style.width=percent+'%'}
file.onchange=()=>{if(src)URL.revokeObjectURL(src);const f=file.files[0];if(!f)return;src=URL.createObjectURL(f);video.src=src;parts=[];last=0;bar.style.width='0';pct.textContent='0 % visto';play.disabled=false;seek.disabled=false;total.textContent='0:00';current.textContent='0:00';seek.value='0';status.textContent='Archivo cargado. Pulsa Reproducir.'};
function toggleVideo(){if(!video.src)return;if(video.paused){video.play().catch(()=>{status.textContent='No se pudo iniciar el vídeo.'})}else video.pause()}
play.onclick=toggleVideo;video.onclick=toggleVideo;video.onloadedmetadata=timeUI;seek.oninput=()=>{if(!Number.isFinite(video.duration)||!video.duration)return;dragging=true;current.textContent=fmt(Number(seek.value)/1000*video.duration)};seek.onchange=()=>{if(Number.isFinite(video.duration)&&video.duration>0){video.currentTime=Number(seek.value)/1000*video.duration;last=video.currentTime}dragging=false;timeUI()};video.onplay=()=>{last=video.currentTime;play.textContent='Ⅱ Pausar'};video.onpause=()=>{const t=video.currentTime,d=t-last;if(d>0&&d<2.5){parts.push([last,t])}last=t;play.textContent='▶ Reproducir';};video.onseeking=()=>{last=video.currentTime};video.onseeked=()=>{last=video.currentTime;timeUI()};video.onerror=()=>{status.textContent='No se pudo reproducir este MP4. Prueba con un archivo H.264/AAC.'};
clock=setInterval(record,500);document.addEventListener('visibilitychange',()=>{if(document.hidden&&!video.paused)video.pause()});
</script></body></html>
